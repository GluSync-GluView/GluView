[versions]
agp                    = "8.6.0"
kotlin                 = "2.0.21"
ksp                    = "2.0.21-1.0.26"
composeBom             = "2024.10.01"
hilt                   = "2.52"
hiltNavigationCompose  = "1.2.0"
navigation             = "2.8.4"
room                   = "2.6.1"
datastore              = "1.1.1"
securityCrypto         = "1.1.0"
retrofit               = "2.11.0"
okhttp                 = "4.12.0"
lifecycle              = "2.8.6"
coroutines             = "1.9.0"
signalr                = "10.0.12"
coreKtx                = "1.13.1"
activityCompose        = "1.9.3"
splashscreen           = "1.0.1"
glance                 = "1.1.0"
work                   = "2.9.1"
biometric              = "1.1.0"
appcompat              = "1.7.0"
carApp                 = "1.4.0"
rxandroidble           = "1.12.1"
rxjava2                = "2.2.21"
# Mesma versão que o SignalR traz; declarada porque o app instala o tratador global (L29).
rxjava3                = "3.0.11"
coroutinesRx2          = "1.9.0"
credentials            = "1.6.0"
# Harness visual (só teste): Robolectric com gráficos nativos + Roborazzi. Roborazzi 1.50.0 é o
# último compilado com Kotlin 2.0.21 (o mesmo do projeto).
robolectric            = "4.14.1"
# Wear OS (plano 14, Fases 5-8): Data Layer, Compose do relógio, complication e tile.
playServicesWearable   = "19.0.0"
wearCompose            = "1.4.0"
wearComplications      = "1.2.1"
wearTiles              = "1.4.1"
wearProtolayout        = "1.2.1"
concurrentFutures      = "1.2.0"
roborazzi              = "1.50.0"

[libraries]
androidx-core-ktx               = { group = "androidx.core",           name = "core-ktx",                      version.ref = "coreKtx" }
androidx-activity-compose       = { group = "androidx.activity",        name = "activity-compose",               version.ref = "activityCompose" }
androidx-splashscreen           = { group = "androidx.core",            name = "core-splashscreen",              version.ref = "splashscreen" }

# Compose
androidx-compose-bom            = { group = "androidx.compose",         name = "compose-bom",                    version.ref = "composeBom" }
androidx-compose-ui             = { group = "androidx.compose.ui",      name = "ui" }
androidx-compose-ui-graphics    = { group = "androidx.compose.ui",      name = "ui-graphics" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3      = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-compose-ui-tooling     = { group = "androidx.compose.ui",      name = "ui-tooling" }

# Navigation
androidx-navigation-compose     = { group = "androidx.navigation",      name = "navigation-compose",             version.ref = "navigation" }

# Lifecycle
androidx-lifecycle-runtime-ktx         = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx",          version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose   = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose",     version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose     = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose",       version.ref = "lifecycle" }
androidx-lifecycle-service             = { group = "androidx.lifecycle", name = "lifecycle-service",               version.ref = "lifecycle" }

# Hilt
hilt-android          = { group = "com.google.dagger", name = "hilt-android",          version.ref = "hilt" }
hilt-compiler         = { group = "com.google.dagger", name = "hilt-android-compiler",  version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt",  name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

# Room
androidx-room-runtime  = { group = "androidx.room", name = "room-runtime",  version.ref = "room" }
androidx-room-ktx      = { group = "androidx.room", name = "room-ktx",      version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler",  version.ref = "room" }

# DataStore
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# Security — EncryptedSharedPreferences (achado #3 da auditoria 2026-07-09: tokens em claro)
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }

# Network
retrofit                = { group = "com.squareup.retrofit2", name = "retrofit",           version.ref = "retrofit" }
retrofit-converter-gson = { group = "com.squareup.retrofit2", name = "converter-gson",     version.ref = "retrofit" }
okhttp                  = { group = "com.squareup.okhttp3",   name = "okhttp",             version.ref = "okhttp" }
okhttp-logging          = { group = "com.squareup.okhttp3",   name = "logging-interceptor", version.ref = "okhttp" }

# Coroutines
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# Charts

# SignalR
signalr = { group = "com.microsoft.signalr", name = "signalr", version.ref = "signalr" }

# S31 — Glance (home screen widget)
androidx-glance-appwidget = { group = "androidx.glance", name = "glance-appwidget", version.ref = "glance" }

# WorkManager — watchdog do serviço de background
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }

# S33 — Biometric (auth antes do logout)
androidx-biometric = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }

# S33 — AppCompat (FragmentActivity necessário para BiometricPrompt)
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }

# S27 — Android Auto (Car App Library — projeção no carro via USB/Bluetooth)
androidx-car-app = { group = "androidx.car.app", name = "app", version.ref = "carApp" }

# F8 Mi Band — RxAndroidBle de verdade (mesma lib/versão que o WatchDrip usa), não mais uma
# réplica manual sobre BluetoothGatt direto.
rxandroidble           = { group = "com.polidea.rxandroidble2", name = "rxandroidble",          version.ref = "rxandroidble" }
rxjava2                = { group = "io.reactivex.rxjava2",      name = "rxjava",                 version.ref = "rxjava2" }
rxjava3                = { group = "io.reactivex.rxjava3",      name = "rxjava",                 version.ref = "rxjava3" }
kotlinx-coroutines-rx2 = { group = "org.jetbrains.kotlinx",     name = "kotlinx-coroutines-rx2", version.ref = "coroutinesRx2" }

# T85 — Passkeys/WebAuthn (Credential Manager). play-services-auth cobre minSdk 26+ via Google Play Services.
androidx-credentials                    = { group = "androidx.credentials", name = "credentials",                    version.ref = "credentials" }
androidx-credentials-play-services-auth = { group = "androidx.credentials", name = "credentials-play-services-auth", version.ref = "credentials" }

# Harness visual (só teste) — ver app/src/test/java/com/gluview/app/visualaudit/README.md
robolectric                     = { group = "org.robolectric",            name = "robolectric",          version.ref = "robolectric" }
roborazzi                       = { group = "io.github.takahirom.roborazzi", name = "roborazzi",            version.ref = "roborazzi" }
roborazzi-compose               = { group = "io.github.takahirom.roborazzi", name = "roborazzi-compose",    version.ref = "roborazzi" }
roborazzi-junit-rule            = { group = "io.github.takahirom.roborazzi", name = "roborazzi-junit-rule", version.ref = "roborazzi" }
androidx-compose-ui-test-junit4   = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }

# Wear OS (plano 14)
play-services-wearable        = { group = "com.google.android.gms", name = "play-services-wearable", version.ref = "playServicesWearable" }
kotlinx-coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "coroutines" }
wear-compose-material         = { group = "androidx.wear.compose", name = "compose-material", version.ref = "wearCompose" }
wear-compose-foundation       = { group = "androidx.wear.compose", name = "compose-foundation", version.ref = "wearCompose" }
wear-complications-data-source-ktx = { group = "androidx.wear.watchface", name = "watchface-complications-data-source-ktx", version.ref = "wearComplications" }
wear-tiles                    = { group = "androidx.wear.tiles", name = "tiles", version.ref = "wearTiles" }
wear-protolayout              = { group = "androidx.wear.protolayout", name = "protolayout", version.ref = "wearProtolayout" }
wear-protolayout-material     = { group = "androidx.wear.protolayout", name = "protolayout-material", version.ref = "wearProtolayout" }
wear-protolayout-expression   = { group = "androidx.wear.protolayout", name = "protolayout-expression", version.ref = "wearProtolayout" }
androidx-concurrent-futures-ktx = { group = "androidx.concurrent", name = "concurrent-futures-ktx", version.ref = "concurrentFutures" }

[plugins]
android-application = { id = "com.android.application",           version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android",      version.ref = "kotlin" }
kotlin-jvm          = { id = "org.jetbrains.kotlin.jvm",          version.ref = "kotlin" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp                 = { id = "com.google.devtools.ksp",            version.ref = "ksp" }
hilt                = { id = "com.google.dagger.hilt.android",     version.ref = "hilt" }
roborazzi           = { id = "io.github.takahirom.roborazzi",      version.ref = "roborazzi" }
